name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The form posts to the Google Apps Script web app (apps-script/signup.gs). Without its address the page would
      # thank people and drop what they sent, so publishing stops.
      - name: Build
        env:
          SIGNUP_URL: ${{ vars.SIGNUP_URL }}
          SITE_URL: https://drive.navetto.ca
        run: |
          if [ -z "$SIGNUP_URL" ]; then echo "::error::Set the repository variable SIGNUP_URL (the Apps Script web app's /exec address)."; exit 1; fi
          node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
